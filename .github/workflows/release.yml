name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 发布前必须 CI 全绿：这里重跑完整门禁
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify committed dist is up to date
        run: git diff --exit-code -- dist

      - name: Test
        run: npm test

      - name: Collect release notes
        run: |
          # 发布详情文档优先：release/release-<版本>.md（版本去掉 v 前缀）
          bare="${GITHUB_REF_NAME#v}"
          if [ -f "release/release-${bare}.md" ]; then
            cp "release/release-${bare}.md" RELEASE_NOTES.md
            echo "使用发布详情文档 release/release-${bare}.md"
          else
            node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
            echo "未找到 release/release-${bare}.md，回退用 CHANGELOG 对应版本段"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 含连字符的标签（如 v0.1.0-beta）标记为预发布，避免占据 latest
          case "${GITHUB_REF_NAME}" in
            *-*) PRE="--prerelease" ;;
            *)   PRE="" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" $PRE \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
